name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc"   >> $GITHUB_ENV
            echo "CXX=g++"  >> $GITHUB_ENV
          fi

      - name: Configure
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset=${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset=${{ matrix.preset }}

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang
      - run: |
          export CC=clang CXX=clang++
          cmake --preset=asan
          cmake --build --preset=asan --parallel
          ctest --preset=asan

  coverage:
    name: Coverage (≥ 95% threshold)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++ lcov
      - name: Run coverage
        run: bash tools/coverage.sh
      - name: Enforce 95% line coverage
        run: |
          PCT=$(lcov --summary build/coverage/coverage.filtered.info --rc lcov_branch_coverage=1 \
                | grep -E '^\s+lines' | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          echo "Line coverage: $PCT %"
          awk -v p="$PCT" 'BEGIN { if (p+0 < 95.0) exit 1 }'
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/html/

  static-analysis:
    name: clang-tidy + cppcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang clang-tidy cppcheck
      - name: Configure (compile_commands.json)
        run: cmake --preset=debug
      - name: clang-tidy
        run: bash tools/run_clang_tidy.sh
      - name: cppcheck
        run: bash tools/run_cppcheck.sh
